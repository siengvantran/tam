<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ask TAM">
  <title>Ask TAM</title>
  <defs>
    <linearGradient id="chrome" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8f8578"/>
      <stop offset=".28" stop-color="#f7f0e3"/>
      <stop offset=".55" stop-color="#cfc5b6"/>
      <stop offset=".8" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#9d9284"/>
